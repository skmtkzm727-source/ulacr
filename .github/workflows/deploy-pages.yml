name: Build and deploy ULAC-R Web

on:
  push:
    branches: [main, compression-lab]
    paths:
      - "CMakeLists.txt"
      - "src/**"
      - "include/**"
      - "tests/**"
      - "tools/**"
      - "README.md"
      - "ARCHITECTURE.md"
      - "web/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run native round-trip tests
        run: |
          cmake -S . -B build-native \
            -DULACR_BUILD_TOOLS=ON \
            -DULACR_BUILD_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-native --parallel 2
          ctest --test-dir build-native --output-on-failure
          ./build-native/tools/gen_test_wav build-native/native-fixture.wav
          ./build-native/tools/ulacr-encode --profile ultra build-native/native-fixture.wav build-native/native-ultra.ulacr
          ./build-native/tools/ulacr-encode --profile classic build-native/native-fixture.wav build-native/native-classic.ulacr

      - name: Verify classic byte identity against the frozen 0.2 implementation
        run: |
          git fetch --no-tags --depth=1 origin d9041ebe8c8bc8c8a306d45cf5ab32f80f235f3a
          git worktree add --detach ../ulacr-legacy d9041ebe8c8bc8c8a306d45cf5ab32f80f235f3a
          cmake -S ../ulacr-legacy -B ../ulacr-legacy/build \
            -DULACR_BUILD_TOOLS=ON -DULACR_BUILD_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build ../ulacr-legacy/build --parallel 2
          ../ulacr-legacy/build/tools/ulacr-encode \
            build-native/native-fixture.wav build-native/legacy-v02.ulacr
          cmp build-native/legacy-v02.ulacr build-native/native-classic.ulacr

      - name: Validate benchmark harness
        run: |
          python3 -m py_compile tools/bench/benchmark.py
          python3 -m unittest discover -s tools/bench -p 'test_*.py'
          python3 tools/bench/benchmark.py \
            --corpus build-native \
            --encoder ./build-native/tools/ulacr-encode \
            --decoder ./build-native/tools/ulacr-decode \
            --profile auto --output build-native/benchmark-smoke.csv

      - name: Copy web interface
        run: |
          mkdir -p dist
          cp web/index.html web/styles.css web/app.js web/codec-worker.js dist/

      - name: Build ULAC-R WebAssembly
        run: |
          docker run --rm -v "$PWD:/src" -w /src emscripten/emsdk:latest bash -lc '
            emcmake cmake -S . -B build-wasm \
              -DULACR_BUILD_TOOLS=OFF \
              -DULACR_BUILD_TESTS=OFF \
              -DULACR_BUILD_WASM=ON \
              -DCMAKE_BUILD_TYPE=Release
            cmake --build build-wasm --parallel 2
          '
          cp build-wasm/web-dist/ulacr.js dist/
          cp build-wasm/web-dist/ulacr.wasm dist/
          node web/wasm/worker-smoke-test.mjs dist build-native/native-ultra.ulacr build-native/native-fixture.wav build-native/native-classic.ulacr build-native/native-fixture.wav

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
