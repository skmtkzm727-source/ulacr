name: Build and deploy ULAC-R Web

on:
  push:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "src/**"
      - "include/**"
      - "web/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy web interface
        run: |
          mkdir -p dist
          cp web/index.html web/styles.css web/app.js dist/

      - name: Build ULAC-R WebAssembly
        run: |
          docker run --rm -v "$PWD:/src" -w /src emscripten/emsdk:latest bash -lc '
            emcmake cmake -S . -B build-wasm \
              -DULACR_BUILD_TOOLS=OFF \
              -DULACR_BUILD_TESTS=OFF \
              -DULACR_BUILD_WASM=ON \
              -DCMAKE_BUILD_TYPE=Release
            cmake --build build-wasm --parallel 2
          '
          cp build-wasm/web-dist/ulacr.js dist/
          cp build-wasm/web-dist/ulacr.wasm dist/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
